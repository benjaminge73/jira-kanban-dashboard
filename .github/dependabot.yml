# Surveillance des dépendances — géré par Dependabot.
# Les mises à jour de SÉCURITÉ ne passent pas par ce fichier : elles sortent
# en PR individuelles et immédiates dès qu'une alerte CVE est levée.
# Ci-dessous : uniquement les version updates hebdomadaires.
# Les majeures restent hors groupe volontairement (1 PR par paquet).

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    ignore:
      # lever-si: decision-humaine rappel-apres: 90j
      # TypeScript 7 est la reecriture native : le detecteur de Next ne le
      # reconnait pas et le build s'arrete sur "trying to use TypeScript but do
      # not have the required package(s) installed". Ce n'est pas une erreur de
      # types, c'est un blocage amont. Next ne declare pas `typescript` en peer,
      # donc aucune condition verifiable : rappel a 90 jours, TS 7 etant recent.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # lever-si: peer eslint-plugin-react eslint >=10
      # ESLint 10 est bloque en amont : `eslint-config-next` depend de
      # `eslint-plugin-react`, dont la derniere version publiee plafonne a
      # `eslint ^9.7` (verifie le 2026-08-06). A retirer des que ce plafond bouge.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    groups:
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
